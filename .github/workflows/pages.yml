name: Publish interviewkata.com

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, for sitemap lastmod dates
      - name: Check every page has the latest shared CSS/JS
        run: cd site && python3 tools/inline_assets.py --check
      - name: Check every page has current SEO tags
        run: cd site && python3 tools/seo.py --check
      - name: Assemble the site
        run: bash site/assemble.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
